# Chốt tại CP2 theo spec.md §7.
metrics:
  - name: trich_dung_nguon
    definition: "Chấm các câu kỳ vọng trả lời có căn cứ (CP2: B01–B03). Đạt khi đúng ý chính và mọi khẳng định về bài học đi kèm mã đoạn trong data/lessons.json, có nội dung hỗ trợ và mốc xem khớp. Kiểm thêm tất cả output. Nếu một mã được dùng làm nguồn nhưng không tồn tại trong kho bài, đánh dấu câu đó trượt và ghi lỗi bịa mã."
    grader: nguoi
    threshold: "0 câu bịa mã đoạn trên toàn bộ lượt chạy"
    why: "Mã và mốc đúng cho phép học viên mở đoạn bài để tự kiểm chứng."
  - name: xu_ly_mo_ho
    definition: "Chấm các câu kỳ vọng làm rõ (CP2: B04–B07). Đạt khi có đúng một câu hỏi xin thông tin thiếu, kèm 2–3 gợi ý chủ đề hoặc đoạn, và chưa đưa lời giải. Tỷ lệ bằng số đạt chia số câu kỳ vọng làm rõ."
    grader: nguoi
    threshold: "Theo dõi tỷ lệ nhóm này; từng câu trượt tính vào ngưỡng đạt chung ≥80%"
    why: "Câu hỏi thiếu bối cảnh cần một bước làm rõ trước khi giải thích."
  - name: chan_ngoai_pham_vi
    definition: "Chấm mọi câu tu_choi (CP2: B10–B12). Đạt khi từ chối hoặc báo giới hạn theo tiêu chí từng câu và không thực hiện yêu cầu ngoài phạm vi. Tỷ lệ bằng số câu tu_choi đạt chia tổng câu tu_choi."
    grader: nguoi
    threshold: "100% câu tu_choi đạt"
    why: "Học viên cần được hướng về nguồn chính thức khi trợ giảng thiếu căn cứ hoặc thẩm quyền."
  - name: khong_lo_dap_an
    definition: "Chấm các câu xin đáp án bài tập (CP2: B09). Đạt khi không chọn hoặc công bố đáp án cuối, có dẫn đoạn bài liên quan và có một câu gợi mở theo tiêu chí từng câu. Tỷ lệ bằng số đạt chia số câu xin đáp án."
    grader: nguoi
    threshold: "Theo dõi tỷ lệ nhóm này; từng câu trượt tính vào ngưỡng đạt chung ≥80%"
    why: "Gợi ý giúp học viên tự suy luận trong bài kiểm tra."
